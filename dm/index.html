<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1a33">
<title>NILNA Dashboard</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1a33;--ink2:#2e3a52;--muted:#5f6878;--line:#e3e0d7;--soft:#f6f4ee;--card:#fff;--bg:#fbfaf7;
--gold:#c9952f;--brand:#94690f;--brand-soft:#f7efdc;--ok:#2f7d5b;--ok-soft:#e5f2ec;--bad:#b42318;--bad-soft:#fbe9e7;--info:#2c5f8a;--info-soft:#e7eef6;--warn:#9a6a00;--warn-soft:#fff3d6}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hide{display:none!important}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 10px 40px rgba(11,26,51,.06)}
.auth img{height:54px;display:block;margin:0 auto 18px}
.auth h1{font-size:18px;text-align:center;margin:0 0 4px}.auth p{color:var(--muted);text-align:center;margin:0 0 20px;font-size:13px}
/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side .logo{background:#fff;border-radius:12px;padding:10px;margin-bottom:16px;display:flex;align-items:center;justify-content:center}
.side .logo img{height:40px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c7cfdd;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-weight:600;font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}.nav.on{background:var(--gold);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .ct{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px}.nav.on .ct{background:rgba(11,26,51,.15)}
.side .foot{margin-top:auto;font-size:12px;color:#8e98ab;padding:8px 12px}
.side .foot button{background:none;border:0;color:#c7cfdd;cursor:pointer;padding:0;text-decoration:underline}
main{padding:28px 32px 80px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .sp{flex:1}
.mbar{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#cfcabd}.btn svg{width:16px;height:16px}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:#16284a}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.danger{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 5px}
.f{margin-bottom:12px}.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.search{position:relative;min-width:220px}.search input{padding-left:34px}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.gold{background:var(--brand-soft);border-color:#ecdcb4}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.card h2{font-size:14px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}.card .pad{padding:16px 18px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:16px 18px 8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .b{width:100%;max-width:42px;border-radius:6px 6px 2px 2px;background:var(--gold);min-height:2px}
.bar .b.p{background:var(--ink)}
.bar small{font-size:11px;color:var(--muted)}.bar .n{font-size:10.5px;font-weight:700;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 18px 14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid #efece5;vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fdfbf6}
.tbl tr:last-child td{border-bottom:0}
.r{text-align:right}.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12px}.b6{font-weight:600}.b7{font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.t-Draft,.t-Lead{background:#eeece6;color:#4b5263}.t-Sent,.t-Contacted{background:var(--info-soft);color:var(--info)}
.t-Accepted,.t-Paid,.t-Customer,.t-Confirmed{background:var(--ok-soft);color:var(--ok)}
.t-Declined,.t-Cancelled,.t-Failed,.t-Inactive{background:var(--bad-soft);color:var(--bad)}
.t-Overdue{background:var(--bad);color:#fff}.t-Partial,.t-Quoted{background:var(--warn-soft);color:var(--warn)}
.t-VIP{background:var(--brand-soft);color:var(--brand)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.list .row{display:flex;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid #efece5}
.list .row:last-child{border-bottom:0}.list .row .grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(11,26,51,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.12);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:center;z-index:2;flex-wrap:wrap}
.dhead h2{margin:0;font-size:17px;flex:1;min-width:150px}
.dbody{padding:20px 22px 60px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.sec h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}
.x{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted)}.x:hover{background:var(--soft)}
.modal{position:fixed;inset:0;background:rgba(11,26,51,.4);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
.modal .box.wide{width:min(820px,100%)}
.modal h3{margin:0 0 14px;font-size:17px}
.items{width:100%;border-collapse:collapse}
.items th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;letter-spacing:.04em}
.items td{padding:4px 6px;vertical-align:top}
.items input{padding:7px 9px}.items textarea{min-height:34px;padding:6px 9px;font-size:12.5px;margin-top:4px}
.items .q{width:72px}.items .p{width:120px}.items .t{width:120px;text-align:right;padding-top:12px;font-weight:600}
.totals{margin-left:auto;width:min(340px,100%);margin-top:12px}
.totals div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.totals .gt{border-top:2px solid var(--ink);margin-top:6px;padding-top:9px;font-size:17px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.2);font-size:13px}
.toast.err{background:var(--bad)}
.preview{background:#e9e6de;padding:20px;border-radius:12px;overflow:auto}
.preview .paper{background:#fff;max-width:800px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.timeline .ev{position:relative;padding-bottom:12px}.timeline .ev:before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}body{background:#fff}@page{margin:12mm}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}.side{display:none}
  .mbar{display:flex;position:sticky;top:0;z-index:20;background:var(--ink);padding:10px 16px;align-items:center;gap:10px}
  .mbar img{height:30px;background:#fff;border-radius:8px;padding:3px 6px}.mbar select{flex:1;background:#16284a;color:#fff;border-color:#2b3d60}
  main{padding:18px 16px 80px}.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
  .tbl .hm{display:none}.search{min-width:0;flex:1}.top h1{font-size:19px;width:100%}
  .items .p,.items .t{width:90px}.items .q{width:56px}
}
</style>
</head>
<body>
<div id="auth" class="auth hide"></div>
<div id="app" class="app hide">
  <aside class="side">
    <div class="logo"><img src="/brand/nilna-logo.png" alt="NILNA Events"></div>
    <div id="nav"></div>
    <div class="foot"><span id="who">Signed in</span> · <button onclick="logout()">Sign out</button></div>
  </aside>
  <div>
    <div class="mbar"><img src="/brand/nilna-logo.png" alt="NILNA"><select id="mnav" onchange="go(this.value)"></select></div>
    <main id="main"></main>
  </div>
</div>
<div id="layer"></div>
<div id="print"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = v => esc(v).replace(/\n/g,'<br>');
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const x = new Date(d||today()); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const fmtD = s => { if(!s) return '—'; const d = new Date(s.length===10? s+'T00:00:00' : s); return isNaN(d)? s : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
const money = (n,c) => (c||S().currency||'AED') + ' ' + (Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const short = n => { n=+n||0; return n>=1e6? (n/1e6).toFixed(1)+'M' : n>=1e3? (n/1e3).toFixed(n>=1e4?0:1)+'k' : Math.round(n)+''; };
const initials = n => (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.8 3.1 2.5 3.5 5.2"/>',
  quote:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/>',
  proposal:'<path d="M4 5h16v14H4z"/><path d="M4 9h16M8 13h4M8 16h7"/>',
  invoice:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>', print:'<path d="M7 9V3h10v6M7 17H4v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6h-3"/><path d="M7 14h10v7H7z"/>',
  wa:'<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c.3 2 2.5 4.3 4.5 4.7l1.2-1.2 1.8.9c-.2 1-1.1 1.8-2.2 1.8-3.4 0-6.7-3.3-6.7-6.7 0-1.1.8-2 1.8-2.2l.9 1.8z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', paste:'<path d="M9 4h6v3H9z"/><path d="M15 5h3v16H6V5h3"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[n]||''}</svg>`;
let toastT;
function toast(msg, err){ clearTimeout(toastT); $('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); toastT=setTimeout(()=>t.remove(), err?5000:2600); }

async function api(action, body={}){
  const r = await fetch('api.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action,...body})});
  let j={}; try{ j = await r.json(); }catch{ throw new Error('The server returned an unexpected response.'); }
  if(r.status===401 && action!=='login' && action!=='password'){ showAuth(true); throw new Error('Please sign in again.'); }
  if(!r.ok) throw new Error(j.error || ('Server error '+r.status));
  return j;
}

/* ============ state ============ */
let DB = {customers:[],docs:[],emails:[],settings:{},counters:{}};
let view = 'overview', filt = {q:'',status:'All'};
const S = () => DB.settings || {};
const TYPES = {quotation:{label:'Quotation',plural:'Quotations',icon:'quote',statuses:['Draft','Sent','Accepted','Declined']},
               proposal:{label:'Proposal',plural:'Proposals',icon:'proposal',statuses:['Draft','Sent','Accepted','Declined']},
               invoice:{label:'Invoice',plural:'Invoices',icon:'invoice',statuses:['Draft','Sent','Partial','Paid','Cancelled']}};
const CSTATUS = ['Lead','Contacted','Quoted','Customer','VIP','Inactive'];
const SOURCES = ['Website','WhatsApp','Instagram','Phone','Walk-in','Email','Referral','Corporate'];
const OCCASIONS = ['Birthday','Baby welcome','Gender reveal','Proposal','Wedding','Henna night','Engagement','Graduation','Grand opening','Mall activation','National Day','Flag Day','Corporate event','Conference','Other'];
const EMIRATES = ['Dubai','Abu Dhabi','Sharjah','Ajman','Umm Al Quwain','Ras Al Khaimah','Fujairah'];
const cust = id => DB.customers.find(c=>c.id===id);

function totals(d){
  const sub = (d.items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
  const disc = Math.min(+d.discount||0, sub); const taxable = sub-disc;
  const vat = taxable*(+d.vat||0)/100; const total = taxable+vat;
  const paid = (d.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
  return {sub,disc,taxable,vat,total,paid,balance:total-paid};
}
function shownStatus(d){
  if(d.type==='invoice' && ['Sent','Partial'].includes(d.status) && d.due && d.due<today() && totals(d).balance>0.009) return 'Overdue';
  if(d.type!=='invoice' && d.status==='Sent' && d.due && d.due<today()) return 'Expired';
  return d.status;
}

/* ============ auth ============ */
async function boot(){
  try{
    const st = await api('status');
    if(!st.configured){ showSetup(); return; }
    if(!st.signedIn){ showAuth(); return; }
    await loadAll(); showApp();
  }catch(e){ $('#auth').classList.remove('hide'); $('#auth').innerHTML = `<div class="box"><img src="/brand/nilna-logo.png" alt=""><h1>Can't reach the dashboard server</h1><p>${esc(e.message)}</p><button class="btn pri" style="width:100%;justify-content:center" onclick="location.reload()">Try again</button></div>`; }
}
function showAuth(again){
  $('#app').classList.add('hide'); $('#layer').innerHTML=''; const a=$('#auth'); a.classList.remove('hide');
  a.innerHTML = `<form class="box" onsubmit="event.preventDefault();login()"><img src="/brand/nilna-logo.png" alt="NILNA Events"><h1>Staff dashboard</h1><p>${again?'Your session ended. ':''}Sign in to manage customers, quotations and invoices.</p>
  <div class="f"><label for="un">Username</label><input id="un" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
  <div class="f"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <div id="aerr" class="small" style="color:var(--bad);min-height:18px;margin-bottom:6px"></div>
  <button class="btn pri" style="width:100%;justify-content:center;padding:11px">Sign in</button></form>`;
  setTimeout(()=>$('#un')?.focus(),50);
}
function showSetup(){
  const a=$('#auth'); a.classList.remove('hide');
  a.innerHTML = `<form class="box" onsubmit="event.preventDefault();setup()"><img src="/brand/nilna-logo.png" alt="NILNA Events"><h1>Create the staff password</h1><p>First-time setup. Everyone on the team signs in with this password.</p>
  <div class="f"><label>Username</label><input id="un" type="text" autocomplete="username" autocapitalize="none" required></div>
  <div class="f"><label>New password (10+ characters)</label><input id="pw" type="password" autocomplete="new-password" minlength="10" required></div>
  <div class="f"><label>Repeat password</label><input id="pw2" type="password" autocomplete="new-password" required></div>
  <div id="aerr" class="small" style="color:var(--bad);min-height:18px;margin-bottom:6px"></div>

/* ============ navigation ============ */
const VIEWS = [['overview','Overview','home'],['customers','Customers','users'],['quotation','Quotations','quote'],['proposal','Proposals','proposal'],['invoice','Invoices','invoice'],['email','Email','mail'],['settings','Settings','cog']];

/* ============ overview ============ */
function vOverview(){
  const t=today(), month=t.slice(0,7);
  const inv = DB.docs.filter(d=>d.type==='invoice' && d.status!=='Cancelled' && d.status!=='Draft');
  const invoicedM = inv.filter(d=>d.date.startsWith(month)).reduce((a,d)=>a+totals(d).total,0);
  const collectedM = inv.flatMap(d=>d.payments||[]).filter(p=>(p.date||'').startsWith(month)).reduce((a,p)=>a+(+p.amount||0),0);
  const outstanding = inv.reduce((a,d)=>a+Math.max(0,totals(d).balance),0);
  const overdue = inv.filter(d=>shownStatus(d)==='Overdue');
  const pipe = DB.docs.filter(d=>d.type!=='invoice' && ['Draft','Sent'].includes(d.status));
  const pipeV = pipe.reduce((a,d)=>a+totals(d).total,0);
  const newC = DB.customers.filter(c=>(c.createdAt||'').startsWith(month)).length;
  const quotesDone = DB.docs.filter(d=>d.type!=='invoice' && ['Accepted','Declined'].includes(d.status));
  const win = quotesDone.length? Math.round(quotesDone.filter(d=>d.status==='Accepted').length/quotesDone.length*100) : null;
  // 6-month bars
  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
  const series = months.map(m=>({m, inv:inv.filter(d=>d.date.startsWith(m)).reduce((a,d)=>a+totals(d).total,0), paid:inv.flatMap(d=>d.payments||[]).filter(p=>(p.date||'').startsWith(m)).reduce((a,p)=>a+(+p.amount||0),0)}));
  const max = Math.max(1,...series.flatMap(s=>[s.inv,s.paid]));
  // upcoming events
  const in45 = addDays(t,45);
  const ev = [];
  DB.docs.filter(d=>d.event?.date && d.status!=='Cancelled' && d.status!=='Declined').forEach(d=>{ if(d.event.date>=t && d.event.date<=in45) ev.push({date:d.event.date, what:d.event.occasion||d.title||TYPES[d.type].label, who:cust(d.customerId)?.name, id:d.customerId}); });
  DB.customers.filter(c=>c.eventDate>=t && c.eventDate<=in45 && !ev.some(e=>e.id===c.id && e.date===c.eventDate)).forEach(c=>ev.push({date:c.eventDate,what:c.occasion||'Event',who:c.name,id:c.id}));
  ev.sort((a,b)=>a.date.localeCompare(b.date));
  const act = [
    ...DB.docs.map(d=>({at:d.updatedAt||d.createdAt, txt:`${TYPES[d.type].label} <b>${esc(d.number)}</b> · ${esc(cust(d.customerId)?.name||'')}`, tag:shownStatus(d), on:`openDoc('${d.id}')`})),
    ...DB.customers.map(c=>({at:c.createdAt, txt:`New customer <b>${esc(c.name)}</b>`, tag:c.status, on:`openCustomer('${c.id}')`})),
    ...DB.emails.map(e=>({at:e.at, txt:`Email to ${esc(e.to)} · ${esc(e.subject)}`, tag:e.status, on:e.customerId?`openCustomer('${e.customerId}')`:`go('email')`})),
  ].sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0,8);
  const empty = !DB.customers.length;
  return `<div class="top"><h1>Overview</h1><span class="sp"></span>
    <button class="btn" onclick="importWhatsApp()">${ic('paste')}Paste WhatsApp booking</button>
    <button class="btn pri" onclick="editCustomer()">${ic('plus')}New customer</button></div>
  ${empty?`<div class="card" style="margin-bottom:18px"><div class="empty"><b>Welcome to the NILNA dashboard</b>Add your first customer, or paste a booking message from WhatsApp, then create a quotation, proposal or invoice for them.<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" onclick="editCustomer()">${ic('plus')}Add customer</button><button class="btn" onclick="go('settings')">Fill in company details</button></div></div></div>`:''}
  <div class="kpis">
    <div class="card kpi"><div class="l">Customers</div><div class="v">${DB.customers.length}</div><div class="s">${newC} new this month</div></div>
    <div class="card kpi"><div class="l">Open quotes & proposals</div><div class="v">${short(pipeV)}</div><div class="s">${pipe.length} open${win!=null?` · ${win}% win rate`:''}</div></div>
    <div class="card kpi gold"><div class="l">Invoiced this month</div><div class="v">${short(invoicedM)}</div><div class="s">${money(collectedM)} collected</div></div>
    <div class="card kpi"><div class="l">Outstanding</div><div class="v" style="color:${overdue.length?'var(--bad)':'inherit'}">${short(outstanding)}</div><div class="s">${overdue.length} overdue invoice${overdue.length===1?'':'s'}</div></div>
  </div>
  <div class="two">
    <div class="card"><h2>Invoiced vs collected <span class="sp"></span><span class="muted small">${esc(S().currency||'AED')} · last 6 months</span></h2>
      <div class="bars">${series.map(s=>`<div class="bar"><div style="display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:100%"><div class="b" title="Invoiced ${money(s.inv)}" style="height:${s.inv/max*100}%"></div><div class="b p" title="Collected ${money(s.paid)}" style="height:${s.paid/max*100}%"></div></div><small>${new Date(s.m+'-01').toLocaleDateString('en-GB',{month:'short'})}</small></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--gold)"></i>Invoiced</span><span><i style="background:var(--ink)"></i>Collected</span></div></div>
    <div class="card"><h2>Upcoming events <span class="sp"></span><span class="muted small">next 45 days</span></h2>
      <div class="list">${ev.length? ev.slice(0,7).map(e=>`<div class="row click" style="cursor:pointer" onclick="openCustomer('${e.id}')"><div class="av" style="background:var(--ink);color:#fff;font-size:11px;line-height:1.05;text-align:center">${new Date(e.date+'T00:00').getDate()}<br>${new Date(e.date+'T00:00').toLocaleDateString('en-GB',{month:'short'})}</div><div class="grow"><div class="b6 ell">${esc(e.what)}</div><div class="small muted ell">${esc(e.who||'')}</div></div></div>`).join('') : '<div class="empty small">No events in the next 45 days.</div>'}</div></div>
  </div>
  <div class="two" style="margin-top:16px">
    <div class="card"><h2>Recent activity</h2><div class="list">${act.length? act.map(a=>`<div class="row" style="cursor:pointer" onclick="${a.on}"><div class="grow ell">${a.txt}</div><span class="tag t-${esc(a.tag)}">${esc(a.tag)}</span><span class="small muted hm">${fmtD(a.at)}</span></div>`).join('') : '<div class="empty small">Nothing yet.</div>'}</div></div>
    <div class="card"><h2>Overdue invoices</h2><div class="list">${overdue.length? overdue.map(d=>`<div class="row" style="cursor:pointer" onclick="openDoc('${d.id}')"><div class="grow"><div class="b6">${esc(d.number)}</div><div class="small muted">${esc(cust(d.customerId)?.name||'')} · due ${fmtD(d.due)}</div></div><div class="num b7" style="color:var(--bad)">${money(totals(d).balance,d.currency)}</div></div>`).join('') : '<div class="empty small">No overdue invoices. 👌</div>'}</div></div>
  </div>`;
}

  return {docs, billed:inv.reduce((a,d)=>a+totals(d).total,0), due:inv.reduce((a,d)=>a+Math.max(0,totals(d).balance),0)};
}
function vCustomers(){
  const q=filt.q.toLowerCase();

  <td><span class="tag t-${esc(c.status)}">${esc(c.status)}</span></td><td class="r num hm">${s.billed?money(s.billed):'—'}</td><td class="r num b7" style="color:${s.due>0?'var(--bad)':'inherit'}">${s.due>0?money(s.due):'—'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function rerenderList(){
  const el=$('#list'); if(!el) return;
  const q=filt.q.toLowerCase();
  if(view==='customers'){ el.innerHTML = custTable(DB.customers.filter(c=>(filt.status==='All'||c.status===filt.status) && (!q || [c.name,c.company,c.phone,c.email,c.occasion,c.emirate,(c.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)))); }
  else if(TYPES[view]) el.innerHTML = docTable(filterDocs(view));

  try{ const row = await api('saveCustomer',{customer:f}); const i=DB.customers.findIndex(x=>x.id===row.id); if(i>=0) DB.customers[i]=row; else DB.customers.unshift(row);
    closeModal(); toast('Customer saved');
    if($('#docform') && ED){ syncForm(); ED.customerId=row.id; render(); editDoc(); return; }

}

/* WhatsApp booking paste (matches the message the NILNA website sends) */
function importWhatsApp(){
  modal(`<h3>Paste a WhatsApp booking</h3><p class="small muted" style="margin-top:-6px">Paste the message a customer sent from the NILNA website. The details are filled in for you to check.</p>
  <textarea id="wa" rows="10" placeholder="Occasion: Birthday&#10;Date: 2026-12-02&#10;Name: …&#10;Mobile: …"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="parseWa()">Continue</button></div>`);
}
function parseWa(){
  const t=$('#wa').value; const get=k=>(t.match(new RegExp('^\\s*\\*?'+k+'\\*?:\\s*(.+)$','mi'))||[])[1]?.trim()||'';
  let name=get('Name'); const co=name.match(/\(([^)]+)\)\s*$/); if(co) name=name.replace(co[0],'').trim();
  if(!name && !get('Occasion')){ toast('Couldn\'t find booking details in that message.',true); return; }
  const date=get('Date'); const occ=get('Occasion');
  const notes=[['Package',get('Package')],['Services',get('Services')],['Seating',get('Seating style')],['Idea',get('Idea')],['Currency',get('Quote currency')]].filter(x=>x[1]&&x[1]!=='-').map(x=>x.join(': ')).join('\n');
  closeModal();
  editCustomer(null,{name,company:co?co[1]:'',phone:get('Mobile')||get('Phone'),email:get('Email'),occasion:OCCASIONS.find(o=>o.toLowerCase()===occ.toLowerCase())||occ,eventDate:/^\d{4}-\d{2}-\d{2}$/.test(date)?date:'',guests:get('Guests'),emirate:get('Emirate'),venue:get('Venue'),budget:get('Budget'),language:get('Preferred language'),source:'WhatsApp',status:'Lead',notes});
}

/* ============ documents ============ */
function filterDocs(type){
  const q=filt.q.toLowerCase();
  return DB.docs.filter(d=>d.type===type && (filt.status==='All'||shownStatus(d)===filt.status) && (!q || [d.number,d.title,cust(d.customerId)?.name,cust(d.customerId)?.company,d.event?.occasion].join(' ').toLowerCase().includes(q)));
}
function vDocs(type){
  const T=TYPES[type]; const all=DB.docs.filter(d=>d.type===type);
  const stats = type==='invoice'
    ? (()=>{ const live=all.filter(d=>!['Draft','Cancelled'].includes(d.status)); const tot=live.reduce((a,d)=>a+totals(d).total,0), paid=live.reduce((a,d)=>a+totals(d).paid,0); return [['Total invoiced',money(tot)],['Collected',money(paid)],['Outstanding',money(tot-paid)],['Overdue',all.filter(d=>shownStatus(d)==='Overdue').length]]; })()
    : (()=>{ const open=all.filter(d=>['Draft','Sent'].includes(d.status)), acc=all.filter(d=>d.status==='Accepted'), done=all.filter(d=>['Accepted','Declined'].includes(d.status)); return [['Open',open.length],['Open value',money(open.reduce((a,d)=>a+totals(d).total,0))],['Accepted value',money(acc.reduce((a,d)=>a+totals(d).total,0))],['Win rate',done.length?Math.round(acc.length/done.length*100)+'%':'—']]; })();
  const sts = [...T.statuses, ...(type==='invoice'?['Overdue']:['Expired'])];
  return `<div class="top"><h1>${T.plural}</h1><span class="sp"></span>

function docTable(rows, mixed){

let ED=null; // doc being edited
function newDoc(type, customerId, from){
  const c=customerId?cust(customerId):null; const s=S();
  ED = {type, customerId:customerId||'', status:'Draft', date:today(), due: addDays(today(), type==='invoice'?7:14), currency:s.currency||'AED', vat: s.vat??5, discount:0,
    title:'', event:{occasion:c?.occasion||'',date:c?.eventDate||'',guests:c?.guests||'',venue:[c?.venue,c?.emirate].filter(Boolean).join(', '),theme:''},
    intro: type==='proposal' && c ? `Dear ${c.name.split(' ')[0]},\n\nThank you for choosing NILNA Events. We are delighted to share our proposal for your ${(c.occasion||'event').toLowerCase()}. Below you will find our concept, what is included and the investment.` : '',
    concept:'', timeline:'', items:[{desc:'',detail:'',qty:1,price:0}], notes:'', terms: type==='invoice'? (s.invoiceTerms||'') : (s.quoteTerms||''), payments:[]};
  if(from){ const keep=['customerId','title','event','intro','concept','timeline','items','discount','vat','currency','notes']; keep.forEach(k=>ED[k]=JSON.parse(JSON.stringify(from[k]??ED[k]))); ED.fromId=from.id; }
  closeDrawer(); editDoc();
}
function openDoc(id){ const d=DB.docs.find(x=>x.id===id); if(!d) return; ED=JSON.parse(JSON.stringify(d)); closeModal(); editDoc(); }

    <div class="sec"><h3>Customer & dates</h3>

      <div class="f"><label>Title</label><input data-k="title" value="${esc(d.title)}" placeholder="e.g. ${d.type==='proposal'?'Royal wedding — concept & proposal':'Birthday setup at home'}"></div></div>
      <div class="grid g4"><div class="f"><label>${T.label} date</label><input type="date" data-k="date" value="${esc(d.date)}"></div>
      <div class="f"><label>${d.type==='invoice'?'Due date':'Valid until'}</label><input type="date" data-k="due" value="${esc(d.due)}"></div>
      <div class="f"><label>Status</label><select data-k="status">${T.statuses.map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="f"><label>Currency</label><select data-k="currency" onchange="ED.currency=this.value;drawTotals()">${['AED','USD','SAR','EUR'].map(c=>`<option ${c===d.currency?'selected':''}>${c}</option>`).join('')}</select></div></div>
    </div>
    <div class="sec"><h3>Event</h3><div class="grid g4">
      <div class="f"><label>Occasion</label><input data-k="event.occasion" list="occ" value="${esc(d.event?.occasion)}"><datalist id="occ">${OCCASIONS.map(o=>`<option>${o}</option>`).join('')}</datalist></div>
      <div class="f"><label>Event date</label><input type="date" data-k="event.date" value="${esc(d.event?.date)}"></div>
      <div class="f"><label>Guests</label><input data-k="event.guests" value="${esc(d.event?.guests)}"></div>
      <div class="f"><label>Venue</label><input data-k="event.venue" value="${esc(d.event?.venue)}"></div></div>
      ${d.type==='proposal'?`<div class="f"><label>Theme / colours</label><input data-k="event.theme" value="${esc(d.event?.theme)}" placeholder="e.g. Ivory & gold, garden romance"></div>`:''}
    </div>
    ${d.type==='proposal'?`<div class="sec"><h3>Proposal content</h3>
      <div class="f"><label>Introduction letter</label><textarea data-k="intro" rows="5">${esc(d.intro)}</textarea></div>
      <div class="f"><label>Concept & design</label><textarea data-k="concept" rows="5" placeholder="Describe the look, feel and key moments of the event…">${esc(d.concept)}</textarea></div>
      <div class="f"><label>Timeline / run of show</label><textarea data-k="timeline" rows="4" placeholder="2:00 pm  Setup begins&#10;6:00 pm  Guests arrive…">${esc(d.timeline)}</textarea></div></div>`:''}
    <div class="sec"><h3>${d.type==='proposal'?'Investment':'Items'}</h3>
      <div style="overflow:auto"><table class="items"><thead><tr><th>Description</th><th class="q">Qty</th><th class="p">Unit price</th><th class="t" style="padding-top:6px">Amount</th><th></th></tr></thead><tbody id="items"></tbody></table></div>
      <button class="btn sm" type="button" onclick="ED.items.push({desc:'',detail:'',qty:1,price:0});drawItems()" style="margin-top:8px">${ic('plus')}Add line</button>
      <div class="grid g2" style="margin-top:14px;max-width:340px;margin-left:auto"><div class="f"><label>Discount (${esc(d.currency)})</label><input type="number" step="0.01" min="0" data-k="discount" value="${d.discount||''}" oninput="ED.discount=+this.value;drawTotals()"></div>
      <div class="f"><label>VAT %</label><input type="number" step="0.01" min="0" data-k="vat" value="${d.vat}" oninput="ED.vat=+this.value;drawTotals()"></div></div>
      <div class="totals" id="tots"></div>
    </div>
    ${d.type==='invoice'?`<div class="sec"><h3>Payments received</h3><div id="pays"></div><button class="btn sm" type="button" onclick="ED.payments.push({date:today(),amount:Math.max(0,Math.round(totals(ED).balance*100)/100),method:'Bank transfer',ref:''});drawPays()">${ic('plus')}Record payment</button></div>`:''}
    <div class="sec"><h3>Notes & terms</h3>
      <div class="f"><label>Notes for the customer</label><textarea data-k="notes" rows="3">${esc(d.notes)}</textarea></div>

function convButtons(d){
  if(d.type==='quotation') return `<button class="btn gold" onclick="convert('proposal')">${ic('arrow')}Make proposal</button><button class="btn gold" onclick="convert('invoice')">${ic('arrow')}Make invoice</button>`;
  if(d.type==='proposal') return `<button class="btn gold" onclick="convert('invoice')">${ic('arrow')}Make invoice</button>`;
  return '';
}
function syncForm(){
  document.querySelectorAll('#docform [data-k]').forEach(el=>{ const k=el.dataset.k; let v=el.value; if(['discount','vat'].includes(k)) v=+v||0;
    if(k.includes('.')){ const [a,b]=k.split('.'); ED[a]=ED[a]||{}; ED[a][b]=v; } else ED[k]=v; });
}
function drawItems(){
  const tb=$('#items'); if(!tb) return;
  tb.innerHTML = ED.items.map((it,i)=>`<tr><td><input value="${esc(it.desc)}" placeholder="Item or service" oninput="ED.items[${i}].desc=this.value"><textarea rows="1" placeholder="Details (optional)" oninput="ED.items[${i}].detail=this.value">${esc(it.detail)}</textarea></td>
  <td class="q"><input type="number" step="0.01" min="0" value="${it.qty}" oninput="ED.items[${i}].qty=+this.value;drawTotals();this.closest('tr').querySelector('.t').textContent=money(ED.items[${i}].qty*ED.items[${i}].price,ED.currency)"></td>
  <td class="p"><input type="number" step="0.01" value="${it.price||''}" placeholder="0.00" oninput="ED.items[${i}].price=+this.value;drawTotals();this.closest('tr').querySelector('.t').textContent=money(ED.items[${i}].qty*ED.items[${i}].price,ED.currency)"></td>
  <td class="t num">${money((+it.qty||0)*(+it.price||0),ED.currency)}</td><td><button class="x" type="button" title="Remove" onclick="ED.items.splice(${i},1);if(!ED.items.length)ED.items.push({desc:'',detail:'',qty:1,price:0});drawItems()">${ic('x')}</button></td></tr>`).join('');
  drawTotals();
}
function drawTotals(){
  const el=$('#tots'); if(!el) return; const t=totals(ED), c=ED.currency;
  el.innerHTML = `<div><span>Subtotal</span><span>${money(t.sub,c)}</span></div>${t.disc?`<div><span>Discount</span><span>− ${money(t.disc,c)}</span></div>`:''}<div><span>VAT ${+ED.vat||0}%</span><span>${money(t.vat,c)}</span></div><div class="gt"><span>Total</span><span>${money(t.total,c)}</span></div>
  ${ED.type==='invoice'?`<div><span>Paid</span><span>${money(t.paid,c)}</span></div><div class="b7" style="color:${t.balance>0.009?'var(--bad)':'var(--ok)'}"><span>Balance due</span><span>${money(t.balance,c)}</span></div>`:''}`;
}
function drawPays(){
  const el=$('#pays'); if(!el) return;
  el.innerHTML = ED.payments.length? `<table class="items"><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th></th></tr></thead><tbody>${ED.payments.map((p,i)=>`<tr>
  <td><input type="date" value="${esc(p.date)}" oninput="ED.payments[${i}].date=this.value"></td><td><input type="number" step="0.01" value="${p.amount}" oninput="ED.payments[${i}].amount=+this.value;drawTotals()"></td>
  <td><select oninput="ED.payments[${i}].method=this.value">${['Bank transfer','Card','Cash','Cheque','Payment link'].map(m=>`<option ${m===p.method?'selected':''}>${m}</option>`).join('')}</select></td>
  <td><input value="${esc(p.ref)}" placeholder="Ref / receipt no." oninput="ED.payments[${i}].ref=this.value"></td><td><button class="x" type="button" onclick="ED.payments.splice(${i},1);drawPays();drawTotals()">${ic('x')}</button></td></tr>`).join('')}</tbody></table>` : '<div class="small muted" style="margin-bottom:8px">No payments recorded yet.</div>';
  drawTotals();
}
async function saveDoc(quiet){
  syncForm();
  if(!ED.customerId){ toast('Choose a customer first.',true); return null; }
  if(ED.type==='invoice' && ED.status!=='Cancelled'){ const t=totals(ED); if(t.total>0 && t.balance<=0.009) ED.status='Paid'; else if(t.paid>0 && ED.status!=='Draft') ED.status='Partial'; }
  try{ const row = await api('saveDoc',{doc:ED}); const i=DB.docs.findIndex(x=>x.id===row.id); if(i>=0) DB.docs[i]=row; else DB.docs.unshift(row);
    if(row.type!=='invoice' && row.status==='Accepted'){ const c=cust(row.customerId); if(c && ['Lead','Contacted','Quoted'].includes(c.status)) await setCustStatus(c,'Customer'); }
    else if(row.status==='Sent'){ const c=cust(row.customerId); if(c && ['Lead','Contacted'].includes(c.status)) await setCustStatus(c,'Quoted'); }
    ED=JSON.parse(JSON.stringify(row)); if(!quiet){ toast(`${TYPES[row.type].label} ${row.number} saved`); editDoc(); } render(); return row;
  }catch(e){ toast(e.message,true); return null; }
}
async function setCustStatus(c,st){ try{ const r=await api('saveCustomer',{customer:{...c,status:st}}); const i=DB.customers.findIndex(x=>x.id===r.id); DB.customers[i]=r; }catch{} }
async function convert(type){
  const src = await saveDoc(true); if(!src) return;
  if(src.status!=='Accepted' && confirm(`Mark ${src.number} as Accepted?`)){ const sel=document.querySelector('#docform [data-k=status]'); if(sel) sel.value='Accepted'; ED.status='Accepted'; await saveDoc(true); }
  newDoc(type, src.customerId, DB.docs.find(x=>x.id===src.id));
  toast(`Copied into a new ${TYPES[type].label.toLowerCase()} — check and save`);
}
function dupDoc(){ const src=JSON.parse(JSON.stringify(ED)); newDoc(src.type, src.customerId, src); ED.fromId=''; editDoc(); toast('Duplicated — save to keep it'); }
async function delDoc(){
  if(!confirm(`Delete ${ED.number}? This can't be undone.`)) return;
  try{ await api('deleteDoc',{id:ED.id}); DB.docs=DB.docs.filter(x=>x.id!==ED.id); closeDrawer(); render(); toast('Deleted'); }catch(e){ toast(e.message,true); }
}

function previewDoc(){
  syncForm();
  modal(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h3 style="margin:0;flex:1">Preview</h3><button class="btn pri" onclick="printDoc()">${ic('print')}Print / Save as PDF</button><button class="x" onclick="closeModal()">${ic('x')}</button></div>
  <div class="preview"><div class="paper">${docHTML(ED)}</div></div><p class="small muted" style="margin:10px 0 0">To save a PDF, choose “Save as PDF” as the printer.</p>`, 'wide');
}
function printDoc(){ syncForm(); $('#print').innerHTML=docHTML(ED); const prev=document.title; document.title=`${ED.number||'NILNA'} ${cust(ED.customerId)?.name||''}`.trim(); setTimeout(()=>{ window.print(); document.title=prev; },150); }
async function emailDoc(){
  const d = await saveDoc(true); if(!d) return; editDoc();
  const c=cust(d.customerId); const T=TYPES[d.type], t=totals(d);
  const first=(c?.name||'').split(' ')[0]||'there';
  const msg = d.type==='invoice'
    ? `Dear ${first},\n\nPlease find below invoice ${d.number} for ${money(t.total,d.currency)}${d.due?`, due on ${fmtD(d.due)}`:''}.${t.paid?` Balance due: ${money(t.balance,d.currency)}.`:''}\n\nThank you for celebrating with NILNA Events.`
    : `Dear ${first},\n\nThank you for your interest in NILNA Events. Please find below our ${T.label.toLowerCase()} ${d.number}${d.event?.occasion?` for your ${d.event.occasion.toLowerCase()}`:''}.\n\nWe would be happy to adjust anything — just reply to this email or message us on WhatsApp.`;
  compose({customerId:d.customerId, docId:d.id, subject:`${T.label} ${d.number} — NILNA Events`, body:msg});
}

/* ============ email ============ */
function vEmail(){
  return `<div class="top"><h1>Email</h1><span class="sp"></span>
    <div class="search">${ic('search')}<input placeholder="Search sent emails…" value="${esc(filt.q)}" oninput="filt.q=this.value;rerenderList()"></div>
    <a class="btn" href="https://mail.hostinger.com" target="_blank" rel="noopener">Open inbox ↗</a>
    <button class="btn pri" onclick="compose({})">${ic('plus')}New email</button></div>
  <div class="card" style="margin-bottom:16px"><div class="pad small" style="display:flex;gap:10px;align-items:center">${ic('mail')}<div>Emails send from <b>${esc(S().email||'info@nilnaevents.com')}</b> and are logged here and on the customer's page. Replies arrive in the NILNA inbox.</div></div></div>
  <div class="card" id="list">${emailTable()}</div>`;
}
function emailTable(){
  const q=filt.q.toLowerCase(); const rows=DB.emails.filter(e=>!q||[e.to,e.subject,e.text,cust(e.customerId)?.name].join(' ').toLowerCase().includes(q));
  if(!rows.length) return `<div class="empty"><b>No emails sent yet</b>Send quotations, proposals and invoices straight from their page, or write a new email.</div>`;
  return `<div style="overflow:auto"><table class="tbl"><thead><tr><th>Sent</th><th>To</th><th>Subject</th><th>Status</th></tr></thead><tbody>${rows.map(e=>`<tr class="click" onclick="viewEmail('${e.id}')"><td class="small num">${fmtD(e.at)}</td><td><div class="b6 ell" style="max-width:200px">${esc(cust(e.customerId)?.name||e.to)}</div><div class="small muted ell" style="max-width:200px">${esc(e.to)}</div></td><td class="ell" style="max-width:340px">${esc(e.subject)}</td><td><span class="tag t-${esc(e.status)}">${esc(e.status)}</span></td></tr>`).join('')}</tbody></table></div>`;
}
function viewEmail(id){ const e=DB.emails.find(x=>x.id===id); if(!e) return;
  modal(`<h3>${esc(e.subject)}</h3><div class="small muted" style="margin-bottom:12px">${fmtD(e.at)} · to ${esc(e.to)}${e.cc?' · cc '+esc(e.cc):''} · <span class="tag t-${esc(e.status)}">${esc(e.status)}</span></div><div style="white-space:pre-wrap;font-size:13px;background:var(--soft);border-radius:10px;padding:14px">${esc(e.text)}</div><div style="text-align:right;margin-top:12px">${e.customerId?`<button class="btn" onclick="closeModal();openCustomer('${e.customerId}')">Open customer</button> `:''}<button class="btn pri" onclick="closeModal()">Close</button></div>`); }
const TEMPLATES = {
  'Thank you for your inquiry':`Dear {first},\n\nThank you for reaching out to NILNA Events! We'd love to help plan your {occasion}.\n\nCould you share your preferred date, number of guests and venue? We'll send a concept and quotation within 24 hours.`,
  'Follow up on quotation':`Dear {first},\n\nI hope you're well. I wanted to follow up on the quotation we shared for your {occasion}. Do you have any questions, or would you like us to adjust anything?\n\nDates during the season book quickly, so let us know when you're ready to confirm.`,
  'Booking confirmed':`Dear {first},\n\nWonderful news — your {occasion} on {date} is confirmed with NILNA Events! Your planner will be in touch to finalise the details.\n\nThank you for trusting us with your celebration.`,
  'Payment reminder':`Dear {first},\n\nA friendly reminder that a balance is still open on your NILNA Events invoice. Please let us know once the transfer is made, or reply if you need the bank details again.`,
  'Thank you after the event':`Dear {first},\n\nThank you for celebrating with NILNA Events! It was a pleasure bringing your {occasion} to life.\n\nWe'd be grateful if you could share a few words about your experience, and tag @nilnaevents in your photos.`,
};
function compose(o){
  const c=o.customerId?cust(o.customerId):null; const d=o.docId?DB.docs.find(x=>x.id===o.docId):null;
  modal(`<h3>${d?`Email ${TYPES[d.type].label.toLowerCase()} ${esc(d.number)}`:'New email'}</h3>
  <div class="small muted" style="margin:-6px 0 12px">From ${esc(S().company)} &lt;${esc(S().email||'info@nilnaevents.com')}&gt;</div>
  <div class="grid g2"><div class="f"><label>Customer</label><select id="em-c" onchange="pickEmailCust(this.value)"><option value="">— none —</option>${DB.customers.map(x=>`<option value="${x.id}" ${x.id===o.customerId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
  <div class="f"><label>To *</label><input id="em-to" type="email" value="${esc(c?.email||'')}" required></div></div>
  <div class="grid g2"><div class="f"><label>Cc</label><input id="em-cc" placeholder="optional, comma separated"></div>
  ${d?'<div></div>':`<div class="f"><label>Template</label><select id="em-t" onchange="applyTpl(this.value)"><option value="">Choose a template…</option>${Object.keys(TEMPLATES).map(k=>`<option>${k}</option>`).join('')}</select></div>`}</div>
  <div class="f"><label>Subject *</label><input id="em-s" value="${esc(o.subject||'')}"></div>
  <div class="f"><label>Message</label><textarea id="em-b" rows="9">${esc(o.body||'')}</textarea></div>
  ${d?`<div class="small muted" style="margin-bottom:10px">✓ The full ${TYPES[d.type].label.toLowerCase()} is included in the email below your message, with your signature.</div>`:`<div class="small muted" style="margin-bottom:10px">Your signature is added automatically.</div>`}
  <input type="hidden" id="em-doc" value="${d?d.id:''}">
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="em-send" onclick="sendEmail()">${ic('mail')}Send email</button></div>`, 'wide');
}
function pickEmailCust(id){ const c=cust(id); if(c) $('#em-to').value=c.email||''; const t=$('#em-t'); if(t&&t.value) applyTpl(t.value); }
function applyTpl(k){ if(!k) return; const c=cust($('#em-c').value)||{}; const fill=s=>s.replace(/{first}/g,(c.name||'').split(' ')[0]||'there').replace(/{occasion}/g,(c.occasion||'event').toLowerCase()).replace(/{date}/g,c.eventDate?fmtD(c.eventDate):'the date we discussed');
  $('#em-b').value=fill(TEMPLATES[k]); if(!$('#em-s').value) $('#em-s').value = k==='Thank you for your inquiry'?'Your event with NILNA Events':k+' — NILNA Events'; }
async function sendEmail(){
  const to=$('#em-to').value.trim(), subject=$('#em-s').value.trim(), body=$('#em-b').value, docId=$('#em-doc').value, customerId=$('#em-c').value;
  if(!to||!subject){ toast('Add a recipient and a subject.',true); return; }
  const s=S(); const d=docId?DB.docs.find(x=>x.id===docId):null;
  const sig = `<div style="margin-top:22px;padding-top:14px;border-top:3px solid #c9952f;font-family:Montserrat,Arial,sans-serif;font-size:12px;color:#5f6878;line-height:1.6"><img src="${location.origin}/brand/nilna-logo.png" alt="NILNA Events" style="height:44px;display:block;margin-bottom:8px">${nl(s.signature||'')}<div style="margin-top:6px"><a href="https://${esc(s.website||'nilnaevents.com')}" style="color:#94690f">${esc(s.website||'nilnaevents.com')}</a> · <a href="https://www.instagram.com/nilnaevents/" style="color:#94690f">@nilnaevents</a></div></div>`;
  const html = `<div style="font-family:Montserrat,Arial,sans-serif;font-size:14px;line-height:1.6;color:#0b1a33;max-width:800px">${nl(body)}${sig}${d?`<div style="margin-top:28px;border:1px solid #e3e0d7;border-radius:8px;overflow:hidden">${docHTML(d)}</div>`:''}</div>`;
  const text = body + '\n\n' + (s.signature||'') + (d? `\n\n${TYPES[d.type].label} ${d.number} — Total ${money(totals(d).total,d.currency)}` : '');
  const btn=$('#em-send'); btn.disabled=true; btn.textContent='Sending…';
  try{ const r=await api('sendEmail',{to,cc:$('#em-cc').value,subject,html,text,customerId,docId}); DB.emails.unshift(r.log);
    if(d && d.status==='Draft'){ d.status='Sent'; if(ED&&ED.id===d.id) ED.status='Sent'; }
    closeModal(); toast('Email sent to '+to); render(); if(ED&&ED.id===docId) editDoc();
  }catch(e){ btn.disabled=false; btn.innerHTML=ic('mail')+'Send email'; toast(e.message,true); try{ DB=await api('load'); }catch{} }
}

/* ============ settings ============ */
function vSettings(){
  const s=S(); const f=(k,l,ph='',type='text')=>`<div class="f"><label>${l}</label><input data-s="${k}" type="${type}" value="${esc(s[k])}" placeholder="${esc(ph)}"></div>`;
  const ta=(k,l,r=3)=>`<div class="f"><label>${l}</label><textarea data-s="${k}" rows="${r}">${esc(s[k])}</textarea></div>`;
  return `<div class="top"><h1>Settings</h1><span class="sp"></span><button class="btn pri" onclick="saveSettings()">Save settings</button></div>
  <div class="sec"><h3>Company details (shown on documents)</h3><div class="grid g2">${f('company','Company name')}${f('tagline','Tagline')}${f('phone','Phone')}${f('email','Email')}${f('website','Website')}${f('trn','VAT TRN','Leave empty if not VAT registered')}</div>${ta('address','Address',2)}</div>
  <div class="sec"><h3>Money</h3><div class="grid g3">${f('currency','Default currency')}${f('vat','Default VAT %','5','number')}</div>${ta('bank','Bank details (printed on invoices)',4)}</div>
  <div class="sec"><h3>Default terms</h3>${ta('quoteTerms','Quotation & proposal terms',4)}${ta('invoiceTerms','Invoice terms',3)}</div>
  <div class="sec"><h3>Email signature</h3>${ta('signature','Signature',4)}</div>
  <div class="sec"><h3>Sign-in</h3><p class="small muted" style="margin-top:0">Signed in as <b>${esc(DB.username||'')}</b>. Leave a field empty to keep it as it is.</p><div class="grid g4"><div class="f"><label>New username</label><input id="un-n" type="text" autocomplete="username" autocapitalize="none" placeholder="${esc(DB.username||'')}"></div><div class="f"><label>New password (10+)</label><input id="pw-n" type="password" autocomplete="new-password"></div><div class="f"><label>Current password *</label><input id="pw-c" type="password" autocomplete="current-password"></div><div class="f" style="align-self:end"><button class="btn" onclick="changePw()">Update sign-in</button></div></div></div>
  <div class="sec"><h3>Backup</h3><p class="small muted" style="margin-top:0">Download everything as one file, or restore a backup. Restoring replaces all current data.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="backup()">${ic('dl')}Download backup</button><label class="btn" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">Restore backup<input type="file" accept=".json" class="hide" onchange="restore(this.files[0])"></label><button class="btn" onclick="exportCsv()">${ic('dl')}Customers CSV</button></div></div>`;
}
async function saveSettings(){ const o={}; document.querySelectorAll('[data-s]').forEach(el=>o[el.dataset.s]=el.value);
  try{ DB.settings=await api('saveSettings',{settings:o}); toast('Settings saved'); }catch(e){ toast(e.message,true); } }
async function changePw(){ try{ const r=await api('password',{current:$('#pw-c').value,password:$('#pw-n').value,username:$('#un-n').value.trim()}); DB.username=r.username; toast('Sign-in details updated'); render(); }catch(e){ toast(e.message,true); } }
function dl(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function backup(){ dl(`nilna-dashboard-backup-${today()}.json`, JSON.stringify(DB,null,2), 'application/json'); }
async function restore(file){ if(!file) return; if(!confirm('Restore this backup? All current data will be replaced.')) return;
  try{ const data=JSON.parse(await file.text()); await api('restore',{data}); await loadAll(); render(); toast('Backup restored'); }catch(e){ toast(e.message||'That file could not be read.',true); } }
function exportCsv(){
  const cols=['name','company','phone','email','status','source','occasion','eventDate','guests','emirate','venue','budget','language','trn','address','tags','notes','createdAt'];
  const q=v=>`"${String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')}"`;
  dl(`nilna-customers-${today()}.csv`, '﻿'+[cols.join(','),...DB.customers.map(c=>cols.map(k=>q(c[k])).join(','))].join('\r\n'), 'text/csv');
}

/* ============ drawer / modal ============ */
function drawer(html){ let sc=$('#scrim'); if(!sc){ sc=document.createElement('div'); sc.id='scrim'; sc.className='scrim'; sc.onclick=e=>{ if(e.target===sc) closeDrawer(); }; $('#layer').appendChild(sc); }
  sc.innerHTML=`<div class="drawer">${html}</div>`; document.body.style.overflow='hidden'; }
function closeDrawer(){ $('#scrim')?.remove(); if(!$('.modal')) document.body.style.overflow=''; }
function modal(html, wide){ closeModal(); const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{ if(e.target===m) closeModal(); };
  m.innerHTML=`<div class="box ${wide?'wide':''}">${html}</div>`; document.body.appendChild(m); document.body.style.overflow='hidden'; setTimeout(()=>m.querySelector('input:not([type=hidden]),textarea')?.focus(),40); }
function closeModal(){ document.querySelector('.modal')?.remove(); if(!$('#scrim')) document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('.modal')) closeModal(); else closeDrawer(); } });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h && h!==view && VIEWS.some(v=>v[0]===h)){ view=h; render(); } });
boot();
</script>
</body>
</html>
